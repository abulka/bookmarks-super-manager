[build]
  command = "npm run build"
  publish = "dist"

# SPA catch-all — serve index.html for any path so deep links work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Link-check function endpoint (see netlify/functions/linkcheck.mjs)
[functions]
  directory = "netlify/functions"
